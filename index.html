<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>우성고 카드</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#d6e3f3" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="우성고 카드" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      width:100%;height:100%;margin:0;
      overflow:hidden;
      font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f5f9fe;
    }

    iframe{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#fff;
    }

    #splash{
      position:fixed;
      inset:0;
      z-index:9998;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:#f5f9fe;
      color:#6b7c93;
      font-weight:800;
    }

    #splash.fade{
      opacity:0;
      pointer-events:none;
      transition:opacity .3s;
    }

    .app-icon{
      width:80px;
      height:80px;
      margin-bottom:16px;
    }

    .app-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    #iosNudge{
      position:fixed;
      left:14px;
      right:14px;
      bottom:16px;
      z-index:9999;
      display:none;
      padding:16px;
      border-radius:24px;
      background:rgba(255,255,255,0.96);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.8);
      box-shadow:0 15px 30px rgba(0,0,0,0.1);
      animation:slideUp .35s ease both;
      font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    #iosNudge.show{display:block}

    @keyframes slideUp{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }

    .nudge-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:8px;
    }

    .nudge-title{
      font-weight:900;
      color:#1f4175;
    }

    .close-btn{
      border:0;
      background:transparent;
      font-size:1.5rem;
      cursor:pointer;
    }

    #emergencyBtn{
      position:fixed;
      right:16px;
      bottom:24px;
      z-index:10000;
      display:none;
      background:rgba(255,255,255,0.9);
      backdrop-filter:blur(5px);
      border:1px solid #2563eb;
      border-radius:999px;
      padding:8px 12px;
      font-size:0.8rem;
      font-weight:800;
      color:#2563eb;
    }

    #emergencyBtn.show{display:block}
  </style>
</head>

<body>
  <iframe id="appFrame" title="우성고 카드 시스템" allow="camera; microphone; geolocation; autoplay; fullscreen"></iframe>

  <div id="splash">
    <div class="app-icon">
      <img src="./icon-192.png" alt="아이콘">
    </div>
    <p>연결 중...</p>
  </div>

  <button id="emergencyBtn" type="button">업로드 오류 시 클릭</button>

  <div id="iosNudge">
    <div class="nudge-head">
      <div class="nudge-title">아이폰에서 앱처럼 사용하기</div>
      <button class="close-btn" onclick="closeIosNudge()">×</button>
    </div>
    <div style="font-size:0.85rem; color:#555; line-height:1.6;">
      하단 <b>[공유]</b> 버튼 → <b>[홈 화면에 추가]</b>를 누르면 다음부터 아이콘으로 바로 실행할 수 있습니다.
    </div>
  </div>

<script>
  const APP_URL = "https://script.google.com/macros/s/AKfycbzLyWl4cHIEmwPDhjMGADoWN1MHa2OLhkVtcJldWDlHzRgyz-Yb9CGNleaiwmrV1-ZvBg/exec";
  const $ = (id) => document.getElementById(id);

  if ("serviceWorker" in navigator) {
    if (window.location.protocol.startsWith("http")) {
      navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
    }
  }

  const ua = navigator.userAgent.toLowerCase();

  const isiOS = /iphone|ipad|ipod/.test(ua);

  const isStandalone =
    window.matchMedia("(display-mode: standalone)").matches ||
    window.navigator.standalone === true;

  const isInApp =
    /kakaotalk|instagram|fbav|fban|\bline\b/i.test(ua) ||
    (/naver/i.test(ua) && /inapp|app/i.test(ua));

  function loadApp(){
    const f = $("appFrame");
    f.src = APP_URL;

    f.onload = () => {
      $("splash").classList.add("fade");
      setTimeout(() => {
        $("splash").style.display = "none";
      }, 300);
    };
  }

  function closeIosNudge(){
    $("iosNudge").classList.remove("show");
    localStorage.setItem("WS_IOS_NUDGE_CLOSED", "1");
  }

  function openSafeMode(){
    if (confirm("직접 연결 모드로 전환하시겠습니까?")) {
      window.location.replace(APP_URL);
    }
  }

  $("emergencyBtn").onclick = openSafeMode;

  window.onmessage = (e) => {
    if (!e.origin.includes("script.google.com")) return;

    const type = e.data?.type;

    if (["UPLOAD_PICKER_OPEN", "UPLOAD_START", "UPLOAD_PICKER_TIMEOUT"].includes(type)) {
      $("emergencyBtn").classList.add("show");
    }

    if (type === "UPLOAD_END") {
      $("emergencyBtn").classList.remove("show");
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    loadApp();

    if (isiOS && !isStandalone && !isInApp) {
      if (localStorage.getItem("WS_IOS_NUDGE_CLOSED") !== "1") {
        setTimeout(() => {
          $("iosNudge").classList.add("show");
        }, 1200);
      }
    }
  });
</script>
</body>
</html>
