<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>우성고 카드</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#d6e3f3" />
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    body{
      margin:0;
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #f5f9fe, #d6e3f3);
      overflow:hidden;
    }

    iframe{
      border:none;
      width:100vw;
      height:100vh;
    }

    /* ===== Splash ===== */
    #splash{
      position:fixed;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background: radial-gradient(circle at top left, #f5f9fe, #d6e3f3);
      z-index:9999;
      transition:0.4s;
    }

    #splash.hide{
      opacity:0;
      pointer-events:none;
    }

    .ci{
      width:90px;
      height:90px;
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
      margin-bottom:12px;
    }

    .ci img{
      width:70%;
      height:70%;
      object-fit:contain;
    }

    #splash p{
      margin:0;
      font-size:0.9rem;
      color:#6b7c93;
    }
  </style>
</head>

<body>

  <!-- Splash -->
  <div id="splash">
    <div class="ci">
      <img src="icon-192.png">
    </div>
    <p>불러오는 중...</p>
  </div>

  <!-- App -->
  <iframe id="appFrame"></iframe>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbwWl0hLkWy9xYDNoG9W9aEJNGVA9nVW5S2RNDZPNb3rdIH8n2jLzxfwAAq9pC55Dw0c/exec";

    const frame = document.getElementById("appFrame");
    frame.src = APP_URL;

    // 로딩 끝 → splash 제거
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("splash").classList.add("hide");
      }, 900);
    });

    // 서비스워커 등록
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>

</body>
</html>
