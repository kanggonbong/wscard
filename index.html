<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>우성고 카드 설치</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#d6e3f3" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="우성고 카드" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

  <style>
    :root{
      --bg:#d6e3f3;
      --primary:#2563eb;
      --text:#1f4175;
      --sub:#6882a8;
      --shadow-dark:rgba(110,138,176,.30);
      --shadow-light:rgba(255,255,255,.95);
      --gradient:linear-gradient(135deg,#3b82f6 0%,#2563eb 55%,#1d4ed8 100%);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      width:100%;height:100%;margin:0;
      font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overflow:hidden;
      color:var(--text);
      background:radial-gradient(circle at top left,#f5f9fe 0%,#e4edf8 32%,#d6e3f3 100%);
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }

    .hide{display:none!important}

    iframe{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      display:none;
      background:#fff;
      z-index:100;
    }

    .wrap{
      width:min(430px,94vw);
      position:relative;
      z-index:10;
    }

    .card{
      padding:30px 24px;
      border-radius:34px;
      text-align:center;
      background:linear-gradient(180deg,#f1f5fb 0%,#dce7f5 100%);
      border:1px solid rgba(255,255,255,.62);
      box-shadow:
        18px 18px 34px var(--shadow-dark),
        -12px -12px 26px var(--shadow-light),
        inset 1px 1px 0 rgba(255,255,255,.72);
    }

    .app-icon{
      width:86px;
      height:86px;
      margin:0 auto 18px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .app-icon img{
      width:100%;
      height:100%;
      object-fit:contain;
      filter:drop-shadow(0 10px 18px rgba(37,99,235,.18));
    }

    h1{
      margin:0 0 10px;
      font-size:1.85rem;
      font-weight:900;
      letter-spacing:-.04em;
      color:var(--text);
    }

    .desc{
      margin:0;
      color:var(--sub);
      line-height:1.6;
      font-size:1rem;
      font-weight:650;
      word-break:keep-all;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-top:20px;
      padding:8px 13px;
      border-radius:999px;
      background:linear-gradient(180deg,#fbfdff 0%,#e8eff8 100%);
      border:1px solid rgba(255,255,255,.82);
      color:#4d6fa6;
      font-size:.9rem;
      font-weight:850;
      box-shadow:6px 6px 12px rgba(110,138,176,.18),-5px -5px 10px rgba(255,255,255,.9);
    }

    .warn{
      margin-top:12px;
      padding:12px;
      border-radius:16px;
      background:linear-gradient(180deg,#fff7f7 0%,#ffe6e6 100%);
      color:#ef4444;
      font-size:.9rem;
      font-weight:800;
      line-height:1.5;
    }

    ol{
      list-style:none;
      padding:0;
      margin:22px 0 0;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    li{
      display:flex;
      align-items:center;
      gap:12px;
      text-align:left;
      padding:14px 15px;
      border-radius:18px;
      background:linear-gradient(180deg,#fbfdff 0%,#e8eff8 100%);
      border:1px solid rgba(255,255,255,.82);
      box-shadow:8px 8px 16px rgba(110,138,176,.22),-6px -6px 14px rgba(255,255,255,.92);
      color:#36527f;
      font-size:.96rem;
      font-weight:750;
      line-height:1.35;
    }

    li i{
      width:36px;
      height:36px;
      flex:0 0 36px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 100%);
      color:var(--primary);
    }

    .btns{
      width:100%;
      margin-top:24px;
      display:flex;
      justify-content:center;
    }

    .primary-btn{
      width:100%;
      max-width:250px;
      border:0;
      border-radius:18px;
      padding:16px 20px;
      background:var(--gradient);
      color:#fff;
      font-weight:900;
      font-size:1.05rem;
      cursor:pointer;
      box-shadow:0 14px 24px rgba(37,99,235,.20), inset 1px 1px 0 rgba(255,255,255,.32);
    }

    .primary-btn:active{transform:scale(.98)}

    .small{
      margin-top:20px;
      font-size:.86rem;
      color:#7890b2;
      line-height:1.5;
      font-weight:650;
    }

    #splash{
      position:fixed;
      inset:0;
      z-index:9998;
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:radial-gradient(circle at top left,#f5f9fe 0%,#e4edf8 32%,#d6e3f3 100%);
      transition:opacity .4s ease;
    }

    #splash.show{display:flex}
    #splash.fade{opacity:0;pointer-events:none}

    #splash p{
      margin:0;
      color:#6b7c93;
      font-size:.9rem;
      font-weight:700;
    }

    #iosNudge{
      position:fixed;
      left:14px;
      right:14px;
      bottom:16px;
      z-index:9999;
      display:none;
      padding:16px 16px 18px;
      border-radius:26px;
      background:linear-gradient(180deg,#f8fbff 0%,#e4edf8 100%);
      border:1px solid rgba(255,255,255,.78);
      box-shadow:0 18px 34px rgba(60,90,130,.22), inset 1px 1px 0 rgba(255,255,255,.72);
      animation:slideUp .35s ease both;
    }

    #iosNudge.show{display:block}

    @keyframes slideUp{
      from{opacity:0;transform:translateY(20px)}
      to{opacity:1;transform:translateY(0)}
    }

    .nudge-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }

    .nudge-title{
      display:flex;
      align-items:center;
      gap:9px;
      font-weight:900;
      color:var(--text);
      font-size:1rem;
    }

    .nudge-title i{
      width:32px;
      height:32px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--gradient);
      color:white;
    }

    .nudge-close{
      border:0;
      background:transparent;
      color:#7a8ea9;
      font-size:1.15rem;
      font-weight:900;
      cursor:pointer;
    }

    .nudge-steps{
      margin:0;
      padding:0;
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .nudge-steps li{
      padding:10px 12px;
      font-size:.9rem;
      box-shadow:none;
      background:rgba(255,255,255,.48);
    }

    #emergencyBtn{
      position:fixed;
      right:16px;
      bottom:18px;
      z-index:10000;
      display:none;
      opacity:0;
      border:1px solid rgba(37,99,235,.25);
      background:rgba(224,229,236,.88);
      backdrop-filter:blur(8px);
      border-radius:999px;
      padding:10px 14px;
      font-size:.85rem;
      font-weight:800;
      color:#2563eb;
      box-shadow:0 6px 16px rgba(0,0,0,.12);
      cursor:pointer;
      transition:opacity .25s ease;
    }

    #emergencyBtn.show{display:block;opacity:1}
  </style>
</head>

<body>
  <iframe id="appFrame" title="우성고 카드 시스템" allow="camera; microphone; geolocation; autoplay; fullscreen"></iframe>

  <div id="splash">
    <div class="app-icon">
      <img src="./icon-192.png" alt="우성고 카드 아이콘">
    </div>
    <p>불러오는 중...</p>
  </div>

  <button id="emergencyBtn" type="button">사진 첨부가 안될때 클릭!</button>

  <div id="installUI" class="wrap">
    <div class="card">
      <div class="app-icon">
        <img src="./icon-192.png" alt="우성고 카드 아이콘">
      </div>

      <h1>우성고 카드</h1>
      <p class="desc" id="topMsg">앱처럼 사용하려면 설치가 필요합니다.</p>

      <span class="badge" id="envBadge">
        <i class="fa-solid fa-circle-info"></i> 환경 확인 중…
      </span>

      <div id="warnMsg" class="warn hide">
        ⚠️ 카카오톡/네이버 등 앱 안에서는 설치가 잘 안됩니다.<br>
        꼭 Chrome 또는 Safari에서 열어주세요.
      </div>

      <ol id="steps"></ol>

      <div class="btns">
        <button id="installBtn" class="primary-btn hide" type="button">앱 설치하기</button>
      </div>

      <div class="small">
        설치 완료 후 홈 화면의 <b>[우성고 카드]</b> 아이콘으로 접속해주세요.
      </div>
    </div>
  </div>

  <div id="iosNudge">
    <div class="nudge-head">
      <div class="nudge-title">
        <i class="fa-solid fa-mobile-screen-button"></i>
        아이폰 설치 안내
      </div>
      <button class="nudge-close" type="button" onclick="closeIosNudge()">×</button>
    </div>
    <ol class="nudge-steps">
      <li><i class="fa-solid fa-arrow-up-from-bracket"></i> Safari 하단의 공유 버튼을 누르세요.</li>
      <li><i class="fa-solid fa-square-plus"></i> ‘홈 화면에 추가’를 선택하세요.</li>
      <li><i class="fa-solid fa-plus"></i> 우측 상단 ‘추가’를 누르면 완료됩니다.</li>
    </ol>
  </div>

<script>
  const APP_URL = "https://script.google.com/macros/s/AKfycbzLyWl4cHIEmwPDhjMGADoWN1MHa2OLhkVtcJldWDlHzRgyz-Yb9CGNleaiwmrV1-ZvBg/exec";
  const $ = (id) => document.getElementById(id);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(console.error);
  }

  function setSteps(arr){
    const ol = $("steps");
    if (!arr || arr.length === 0) {
      ol.innerHTML = "";
      ol.style.display = "none";
      return;
    }
    ol.style.display = "flex";
    ol.innerHTML = arr.map(v => `<li>${v}</li>`).join("");
  }

  function showSplash(){
    $("splash").classList.add("show");
  }

  function hideSplash(){
    setTimeout(() => {
      $("splash").classList.add("fade");
      setTimeout(() => $("splash").classList.remove("show"), 450);
    }, 700);
  }

  function showAppInIframe(){
    $("installUI").classList.add("hide");
    $("iosNudge").classList.remove("show");
    showSplash();

    const f = $("appFrame");
    f.src = APP_URL;
    f.style.display = "block";

    f.addEventListener("load", hideSplash, { once:true });
    setTimeout(hideSplash, 1400);
  }

  function openSafeModeTopLevel(){
    if (confirm("영수증 업로드가 잘 안 되나요?\n확인을 누르면 '직접 연결 모드'로 전환합니다.")) {
      window.location.replace(APP_URL);
    }
  }

  function showEmergencyBtn(){
    $("emergencyBtn").classList.add("show");
  }

  function hideEmergencyBtn(){
    const b = $("emergencyBtn");
    b.classList.remove("show");
    setTimeout(() => {
      if (!b.classList.contains("show")) b.style.display = "none";
    }, 260);
  }

  $("emergencyBtn").addEventListener("click", openSafeModeTopLevel);

  window.addEventListener("message", (e) => {
    if (!e.origin || !e.origin.includes("script.google.com")) return;

    const data = e.data || {};
    if (data.source !== "WS_CARD") return;

    if (
      data.type === "UPLOAD_PICKER_OPEN" ||
      data.type === "UPLOAD_START" ||
      data.type === "UPLOAD_PICKER_TIMEOUT"
    ) {
      showEmergencyBtn();
      return;
    }

    if (data.type === "UPLOAD_END") {
      hideEmergencyBtn();
    }
  });

  function closeIosNudge(){
    $("iosNudge").classList.remove("show");
    localStorage.setItem("WS_IOS_NUDGE_CLOSED", "1");
  }

  document.addEventListener("DOMContentLoaded", () => {
    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    // 설치된 홈화면 앱으로 실행했을 때만 실제 앱 실행
    if (isStandalone) {
      showAppInIframe();
      return;
    }

    const ua = navigator.userAgent.toLowerCase();
    const isiOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = /android/.test(ua);

    const isInApp =
      /kakaotalk|instagram|fbav|fban|\bline\b/i.test(ua) ||
      (/naver/i.test(ua) && /inapp|app/i.test(ua));

    $("envBadge").innerHTML =
      isInApp ? `<i class="fa-solid fa-triangle-exclamation"></i> 인앱 브라우저` :
      isiOS ? `<i class="fa-brands fa-apple"></i> iOS 아이폰` :
      isAndroid ? `<i class="fa-brands fa-android"></i> Android 안드로이드` :
      `<i class="fa-solid fa-desktop"></i> PC 데스크톱`;

    if (isInApp) {
      $("warnMsg").classList.remove("hide");
      $("topMsg").innerHTML = "설치를 위해 <b>외부 브라우저</b>로 열어주세요.";
      setSteps([
        `<i class="fa-solid fa-ellipsis"></i> 화면의 <b>[⋯]</b> 또는 <b>[공유]</b> 버튼 클릭`,
        `<i class="fa-solid fa-up-right-from-square"></i> <b>[다른 브라우저로 열기]</b> 선택`,
        `<i class="fa-brands fa-chrome"></i> Chrome 또는 Safari에서 다시 시도`
      ]);
      return;
    }

    if (isiOS) {
      $("topMsg").innerHTML = "아이폰은 <b>홈 화면에 추가</b>하여 사용합니다.";
      setSteps([
        `<i class="fa-brands fa-safari"></i> Safari에서 이 페이지를 열기`,
        `<i class="fa-solid fa-arrow-up-from-bracket"></i> 하단의 <b>공유 버튼</b> 클릭`,
        `<i class="fa-solid fa-square-plus"></i> <b>[홈 화면에 추가]</b> 선택`,
        `<i class="fa-solid fa-plus"></i> 우측 상단 <b>[추가]</b> 버튼 클릭`
      ]);

      if (localStorage.getItem("WS_IOS_NUDGE_CLOSED") !== "1") {
        setTimeout(() => $("iosNudge").classList.add("show"), 700);
      }
      return;
    }

    // Android Chrome: 설치 전용 화면 유지
    $("topMsg").innerHTML = "아래 버튼을 눌러 앱을 설치하세요.";
    setSteps([]);

    let deferredPrompt = null;

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $("installBtn").classList.remove("hide");
    });

    $("installBtn").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      try { await deferredPrompt.userChoice; } catch(_) {}
      deferredPrompt = null;
      $("installBtn").classList.add("hide");
    });

    setTimeout(() => {
      if (!deferredPrompt && isAndroid) {
        setSteps([
          `<i class="fa-solid fa-ellipsis-vertical"></i> Chrome 오른쪽 위 <b>[⋮]</b> 메뉴 클릭`,
          `<i class="fa-solid fa-square-plus"></i> <b>[앱 설치]</b> 또는 <b>[홈 화면에 추가]</b> 선택`
        ]);
      }
    }, 2500);
  });
</script>
</body>
</html>
