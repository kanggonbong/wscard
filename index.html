<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>우성고 카드</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#d6e3f3" />
  <link rel="apple-touch-icon" href="./icon-192.png">

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

  <style>
    body{
      margin:0;
      font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top left, #f5f9fe, #d6e3f3);
      overflow:hidden;
    }

    iframe{
      border:none;
      width:100vw;
      height:100vh;
      display:none;
    }

    /* Splash */
    #splash{
      position:fixed;
      inset:0;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background: radial-gradient(circle at top left, #f5f9fe, #d6e3f3);
      z-index:9999;
      transition:.4s;
    }

    #splash.hide{
      opacity:0;
      pointer-events:none;
    }

    .ci{
      width:90px;
      height:90px;
      border-radius:24px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#3b82f6,#1d4ed8);
      margin-bottom:12px;
    }

    .ci img{
      width:70%;
      height:70%;
      object-fit:contain;
    }

    #splash p{
      margin:0;
      font-size:0.9rem;
      color:#6b7c93;
    }

    /* iOS 안내 */
    #iosGuide{
      position:fixed;
      bottom:20px;
      left:20px;
      right:20px;
      background:#fff;
      border-radius:20px;
      padding:15px;
      box-shadow:0 10px 20px rgba(0,0,0,0.15);
      display:none;
      z-index:10000;
    }

    #iosGuide.show{
      display:block;
    }

    #iosGuide button{
      border:none;
      background:none;
      font-size:18px;
      position:absolute;
      right:10px;
      top:5px;
      cursor:pointer;
    }

  </style>
</head>

<body>

<!-- Splash -->
<div id="splash">
  <div class="ci">
    <img src="icon-192.png">
  </div>
  <p>불러오는 중...</p>
</div>

<!-- iOS 설치 안내 -->
<div id="iosGuide">
  <button onclick="this.parentElement.style.display='none'">×</button>
  <b>홈 화면에 추가</b><br><br>
  1️⃣ 공유 버튼(⬆️) 클릭<br>
  2️⃣ “홈 화면에 추가” 선택<br>
  3️⃣ “추가” 버튼 클릭
</div>

<!-- App -->
<iframe id="appFrame"></iframe>

<script>
  // ✅ 너 URL 정확히 반영됨
  const APP_URL = "https://script.google.com/macros/s/AKfycbzLyWl4cHIEmwPDhjMGADoWN1MHa2OLhkVtcJldWDlHzRgyz-Yb9CGNleaiwmrV1-ZvBg/exec";

  const frame = document.getElementById("appFrame");

  function startApp(){
    frame.src = APP_URL;
    frame.style.display = "block";

    setTimeout(()=>{
      document.getElementById("splash").classList.add("hide");
    }, 900);
  }

  document.addEventListener("DOMContentLoaded", () => {

    const ua = navigator.userAgent.toLowerCase();
    const isiOS = /iphone|ipad|ipod/.test(ua);
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;

    // 앱 설치 상태면 바로 실행
    if(isStandalone){
      startApp();
      return;
    }

    // iOS면 안내 띄움
    if(isiOS){
      document.getElementById("iosGuide").classList.add("show");
    }

    // 그냥 실행 (웹)
    startApp();
  });

  // 서비스워커
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
